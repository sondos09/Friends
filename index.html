<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطاقة تعارف</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#17131f;--panel:#221c2e;--text:#f1ecfa;--muted:#a79cc0;--line:#3a3150;--accent:#38bdf8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:16px;display:grid;gap:20px}
@media(min-width:800px){.wrap{grid-template-columns:1fr 360px;align-items:start}}
h1{margin:0 0 4px;font-size:22px}
.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg button{font:inherit;font-weight:600;padding:10px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.seg button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}
input,textarea{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.stick{position:sticky;top:env(safe-area-inset-top,0px)}
@media(max-width:799px){.stick{position:static}}
.cardbox{display:flex;justify-content:center}
.btn{width:100%;margin-top:14px;font:inherit;font-weight:800;font-size:16px;padding:13px;border:0;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer}
.btn:disabled{opacity:.6}
.msg{min-height:22px;text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
#out{display:none;margin-top:10px;text-align:center}
#out img{max-width:100%;border-radius:12px}

/* ألوان بطاقة الذكور: داكنة شبابية وفخمة */
#card {
  --c1: #0F172A;     
  --c2: #1E293B;     
  --ink: #F8FAFC;    
  --pop: #38BDF8;    
  --soft: #33415580; 
  width:340px;padding:12px;border-radius:26px;background:linear-gradient(160deg,var(--c1),var(--c2));color:var(--ink);position:relative;overflow:hidden;font-family:'Cairo',Tahoma,Arial,sans-serif;direction:rtl
}

/* ألوان بطاقة البنات: داكنة وغامضة عصرية */
#card.girl {
  --c1: #1E112A;     
  --c2: #2D122D;     
  --ink: #FDF4FF;    
  --pop: #F43F5E;    
  --soft: #4C1D9560; 
}

#card .in {
  border: 3px dashed var(--pop);
  border-radius: 20px;
  padding: 12px;
  position: relative;
  background: #000000c0; /* تم التعديل إلى الأسود الداكن الشفاف لراحة العين وبروز النصوص */
}

.dec{position:absolute;font-size:20px;opacity:.85;top:6px}
.ribbon{display:block;width:max-content;margin:0 auto 8px;background:var(--pop);color:#fff;font-weight:800;font-size:15px;padding:2px 18px;border-radius:999px}
.ava{width:104px;height:104px;margin:0 auto 4px;border-radius:50%;background:#1e293b;border:4px solid var(--pop);display:flex;align-items:center;justify-content:center;font-size:48px;line-height:1;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.nm{text-align:center;font-weight:800;font-size:22px;line-height:1.3;word-break:break-word;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cell{background:var(--soft);border-radius:10px;padding:3px 8px;min-width:0}
.cell.full{grid-column:1/-1}
.cell small{display:block;font-size:11px;font-weight:700;color:var(--pop);line-height:1.4}
.cell span{display:block;font-size:13px;font-weight:600;line-height:1.4;word-break:break-word}
.ft{text-align:center;font-size:11px;font-weight:600;margin-top:8px;opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>✨ بطاقة التعارف</h1>
    <p class="sub">اختر نوع البطاقة، ارفع صورتك الكرتونية، عبّئ بياناتك ثم احفظها وانشرها في القروب.</p>
    <div class="panel">
      <div class="seg">
        <button id="bBoy" class="on">👦 ذكر</button>
        <button id="bGirl">👧 أنثى</button>
      </div>
      <label>صورتك الكرتونية (من جهازك)</label>
      <input type="file" id="photo" accept="image/*">
      <div id="form"></div>
    </div>
  </div>
  <div class="stick">
    <div class="cardbox">
      <div id="card">
        <div class="in">
          <span class="dec" id="d1" style="right:8px"></span>
          <span class="dec" id="d2" style="left:8px"></span>
          <span class="ribbon">بطاقة تعارف</span>
          <div class="ava" id="ava">🖼️</div>
          <div class="nm" id="o_name">اسمك هنا</div>
          <div class="grid" id="grid"></div>
          <div class="ft">بطاقة خيالية للمرح فقط</div>
        </div>
      </div>
    </div>
    <button class="btn" id="save">⬇️ احفظ البطاقة كصورة</button>
    <div class="msg" id="msg"></div>
    <div id="out"><p class="sub">اضغط مطولاً على الصورة لحفظها:</p><img id="outImg" alt="بطاقتك"></div>
  </div>
</div>
<script>
var $=function(id){return document.getElementById(id)};
var F=[
['age','العمر','18'],
['country','البلد','ليبيا'],
['color','اللون المفضل','أزرق'],
['num','الرقم المفضل','7'],
['sport','الرياضة المفضلة','كرة القدم'],
['place','مكان أتمنى زيارته','اليابان'],
['anime','شخصية أنمي مفضلة','ناروتو'],
['cartoon','شخصية كرتون مفضلة','توم'],
['animal','الحيوان المفضل','قطة'],
['team','الفريق المفضل','برشلونة'],
['meal','الوجبة المفضلة','بيتزا'],
['religion','الديانة','الإسلام'],
['hair','لون شعري','أسود'],
['eyes','لون عيوني','بني'],
['like','أحب','أحب الأصدقاء والضحك...',1],
['hobby','هواياتي','القراءة، الرسم...',1]
];
var gender='boy';
var GN={boy:'ذكر',girl:'أنثى'};

(function(){
  var f='<label>الاسم</label><input id="f_name" maxlength="24">';
  var g='<div class="cell"><small>الجنس</small><span id="o_gender">ذكر</span></div>';
  F.forEach(function(x){
    f+='<label>'+x[1]+'</label><input id="f_'+x[0]+'" maxlength="'+(x[3]?60:28)+'">';
  });
  $('form').innerHTML=f;
  F.forEach(function(x,i){
    g+='<div class="cell'+(x[3]?' full':'')+'"><small>'+x[1]+'</small><span id="o_'+x[0]+'">—</span></div>';
    if(i===0)g+='<div class="cell"><small>الجنس</small><span id="o_gender2"></span></div>';
  });
  g=g.replace('<div class="cell"><small>الجنس</small><span id="o_gender">ذكر</span></div>','').replace('o_gender2','o_gender');
  $('grid').innerHTML=g;
  $('f_name').addEventListener('input',render);
  F.forEach(function(x){$('f_'+x[0]).addEventListener('input',render)});
  
  // استدعاء الرندرة تلقائياً هنا فور التحميل لتعمل الألوان الداكنة فوراً
  render(); 
})();

function render(){
  $('card').className=gender==='girl'?'girl':'';
  $('d1').textContent=gender==='girl'?'🌸':'⚽';
  $('d2').textContent=gender==='girl'?'🎀':'🎮';
  $('o_gender').textContent=GN[gender];
  $('o_name').textContent=$('f_name').value.trim()||'اسمك هنا';
  F.forEach(function(x){$('o_'+x[0]).textContent=$('f_'+x[0]).value.trim()||'—'});
}

function setG(g){
  gender=g;
  $('bBoy').className=g==='boy'?'on':'';$('bGirl').className=g==='girl'?'on':'';
  document.documentElement.style.setProperty('--accent',g==='boy'?'#38bdf8':'#f43f5e');
  render();
}

$('bBoy').onclick=function(){setG('boy')};
$('bGirl').onclick=function(){setG('girl')};

$('photo').onchange=function(e){
  var file=e.target.files&&e.target.files[0];
  if(!file)return;
  var r=new FileReader();
  r.onload=function(){$('ava').innerHTML='<img alt="" src="'+r.result+'">'};
  r.readAsDataURL(file);
};

// دالة الحفظ والتحميل التلقائي (نسخة واحدة نظيفة ومكتملة)
$('save').onclick = async function(){
  var btn = $('save'), msg = $('msg');
  btn.disabled = true; msg.textContent = 'جاري تجهيز الصورة وتحميلها…';
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    var canvas = await html2canvas($('card'), {scale: 2, backgroundColor: null, useCORS: true});
    var blob = await new Promise(function(r){ canvas.toBlob(r, 'image/png') });
    var url = URL.createObjectURL(blob);
    
    // أولاً: عرضها في الأسفل كالمعتاد
    $('outImg').src = url;
    $('out').style.display = 'block';
    
    // ثانياً: كود التحميل التلقائي والمباشر إلى الجهاز
    var dlLink = document.createElement('a');
    dlLink.download = 'card_' + (Date.now()) + '.png'; // اسم ملف الصورة المنزلة
    dlLink.href = url;
    document.body.appendChild(dlLink);
    dlLink.click(); // محاكاة نقرة برمجية لبدء التحميل فوراً
    document.body.removeChild(dlLink);
    
    msg.textContent = 'تم إنشاء الصورة وتحميلها بنجاح!';
  }catch(err){
    console.error(err);
    msg.textContent = 'حدث خطأ أثناء حفظ الصورة.';
  }finally{
    btn.disabled = false;
  }
};

</script>
</body>
</html>
